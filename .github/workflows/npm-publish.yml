name: Publish to npm
# Push a version tag to publish: git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm version "${GIT_REF#v}" --no-git-tag-version
        env:
          GIT_REF: ${{ github.ref_name }}
      - run: npm publish --access public
